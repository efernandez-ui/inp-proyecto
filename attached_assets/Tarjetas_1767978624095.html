<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intercap V12 - Modo Sin Loguearse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #f3f4f6; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .checkbox-custom { width: 1.25rem; height: 1.25rem; border: 2px solid #9ca3af; border-radius: 0.25rem; appearance: none; cursor: pointer; display: grid; place-content: center; }
        .checkbox-custom::before { content: ""; width: 0.75rem; height: 0.75rem; transform: scale(0); transition: 120ms transform ease-in-out; box-shadow: inset 1em 1em #2563eb; transform-origin: center; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }
        .checkbox-custom:checked::before { transform: scale(1); }
        .checkbox-custom:checked { border-color: #2563eb; }
        
        /* Estilo para switch de modo invitado */
        .guest-mode-active { filter: grayscale(100%); opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- ICONOS ---
        const Icon = ({ children, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Icons = {
            Cart: (p) => <Icon {...p}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></Icon>,
            Trash: (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Icon>,
            Heart: (p) => <Icon {...p}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></Icon>,
            ArrowLeftRight: (p) => <Icon {...p}><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></Icon>,
            Link: (p) => <Icon {...p}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></Icon>,
            Bike: (p) => <Icon {...p}><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></Icon>,
            Info: (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Icon>,
            ChevronLeft: (p) => <Icon {...p}><polyline points="15 18 9 12 15 6"/></Icon>,
            ChevronRight: (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"/></Icon>,
            Calculator: (p) => <Icon {...p}><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></Icon>,
            Grid: (p) => <Icon {...p}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></Icon>,
            List: (p) => <Icon {...p}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Icon>,
            Lock: (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>
        };

        // --- DATOS MOCK ---
        const BASE_IMAGES = [
            "https://imagenes-inp-aws.s3.amazonaws.com/imagenes/productos/001/12042023-001001010165-1_min.jpg",
            "https://imagenes-inp-aws.s3.amazonaws.com/imagenes/productos/001/12042023-001001010165-2_min.jpg",
            "https://imagenes-inp-aws.s3.amazonaws.com/imagenes/productos/001/12042023-001001010165-3_min.jpg"
        ];
        const MOCK_PRODUCTS = [
            { id: '1', sku: '001001010165', title: '2.50-17 M/C TL 38P SUPER CITY FRONT', brand: 'PIRELLI', category: 'Cubiertas', pricePublic: 86183.00, priceLogged: 77564.70, presentation: ['1° Envase Botella 1 UNI', '2° Envase Cajas 12 UNI'], stock: { total: 50, noa: 'low', nea: 'medium', bue: 'high', cuy: 'none' }, images: BASE_IMAGES },
            { id: '2', sku: '001001010166', title: '2.75-18 M/C TL 42P CITY DEMON REAR', brand: 'PIRELLI', category: 'Cubiertas', pricePublic: 95200.00, priceLogged: 85600.00, presentation: ['1° Envase Botella 1 UNI', '2° Envase Cajas 10 UNI'], stock: { total: 20, noa: 'high', nea: 'high', bue: 'low', cuy: 'medium' }, images: BASE_IMAGES },
            { id: '3', sku: '002005001', title: 'ACEITE MOTUL 3000 4T 20W50 1L', brand: 'MOTUL', category: 'Lubricantes', pricePublic: 12500.00, priceLogged: 10500.00, presentation: ['Caja x 12 Unidades'], stock: { total: 100, noa: 'high', nea: 'high', bue: 'high', cuy: 'high' }, images: [BASE_IMAGES] }
        ];

        // --- COMPONENTES UI ---
        const StockBattery = ({ level, label }) => {
            const getColor = (lvl) => ({ 'high': 'bg-green-500', 'medium': 'bg-yellow-400', 'low': 'bg-orange-500', 'none': 'bg-gray-200' }[lvl] || 'bg-gray-200');
            return (
                <div className="flex flex-col items-center gap-1">
                    <span className="text-[10px] font-bold text-gray-400 uppercase">{label}</span>
                    <div className={`w-3 h-6 rounded-sm ${getColor(level)} border border-gray-300 relative shadow-sm`}>
                        <div className="absolute -top-0.5 left-1/2 -translate-x-1/2 w-1.5 h-0.5 bg-gray-300"></div>
                    </div>
                </div>
            );
        };

        const SideIcon = ({ icon }) => (
            <button className="p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 transition-colors rounded-md bg-white/80 backdrop-blur-sm shadow-sm mb-1 z-30">{icon}</button>
        );

        // --- TARJETA ---
        const ProductCard = ({ product, viewMode, isLogged, showDetails, markup, showPublicPrice, isGuest }) => {
            const [currentImg, setCurrentImg] = useState(0);
            const [inputQty, setInputQty] = useState(1);
            const [cartQty, setCartQty] = useState(0);

            const finalPrice = isLogged ? product.priceLogged : product.pricePublic;
            const listPrice = isLogged ? product.pricePublic : null;
            const publicPriceWithMarkup = finalPrice * (1 + (markup / 100));
            const formatCurrency = (val) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(val);

            const handleAdd = () => { if (inputQty > 0) setCartQty(inputQty); };
            const handleRemove = () => { setCartQty(0); setInputQty(1); };
            const nextImage = (e) => { e?.stopPropagation(); setCurrentImg((p) => (p + 1) % product.images.length); };
            const prevImage = (e) => { e?.stopPropagation(); setCurrentImg((p) => (p - 1 + product.images.length) % product.images.length); };

            // === CONTENIDO COMÚN (Botón de Compra) ===
            const ActionButtons = () => {
                if (isGuest) return null; // Ocultar si es invitado
                
                return (
                    <div className="h-10 w-full">
                        {cartQty === 0 ? (
                            <div className="flex w-full h-full gap-2">
                                <button onClick={handleAdd} disabled={product.stock.total === 0} className={`flex-grow rounded-md font-bold text-sm flex items-center justify-center gap-2 shadow-sm transition-colors ${product.stock.total === 0 ? 'bg-gray-100 text-gray-400' : 'bg-blue-600 hover:bg-blue-700 text-white'}`}>
                                    <Icons.Cart size={18} /> {viewMode === 'grid' ? 'AGREGAR' : 'AGREGAR AL CARRO'}
                                </button>
                                <div className="w-16 bg-gray-100 border border-gray-200 rounded-md flex items-center justify-center relative">
                                    <input type="number" min="1" value={inputQty} onChange={(e) => setInputQty(Math.max(1, parseInt(e.target.value) || 1))} className="w-full h-full bg-transparent text-center font-bold text-gray-700 text-sm focus:outline-none z-10" />
                                    <div className="absolute right-0.5 top-0 bottom-0 flex flex-col justify-center gap-0.5 opacity-50">
                                        <button onClick={() => setInputQty(q => q + 1)} className="hover:bg-gray-300 rounded-sm px-0.5"><div className="w-0 h-0 border-l-[3px] border-l-transparent border-r-[3px] border-r-transparent border-b-[4px] border-b-gray-600"></div></button>
                                        <button onClick={() => setInputQty(q => Math.max(1, q - 1))} className="hover:bg-gray-300 rounded-sm px-0.5"><div className="w-0 h-0 border-l-[3px] border-l-transparent border-r-[3px] border-r-transparent border-t-[4px] border-t-gray-600"></div></button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="flex w-full h-full rounded-md overflow-hidden shadow-md animate-[pulse_0.2s_ease-in-out]">
                                <button onClick={handleRemove} className="flex-grow bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-xs uppercase flex items-center justify-center gap-2 transition-colors"><Icons.Trash size={16} /> QUITAR</button>
                                <div className="w-24 bg-[#E3001B] text-white font-bold text-sm flex items-center justify-center">{cartQty} UNI</div>
                            </div>
                        )}
                    </div>
                );
            };

            // === CONTENIDO COMÚN (Bloque de Precios) ===
            const PriceBlock = () => {
                // Si es invitado, mostrar mensaje alternativo
                if (isGuest) {
                    return (
                        <div className="flex flex-col items-center justify-center h-24 border border-dashed border-gray-300 rounded-lg bg-gray-50 p-2 text-center">
                            <Icons.Lock size={20} className="text-gray-400 mb-1" />
                            <span className="text-xs text-gray-500 font-medium">Inicie sesión para<br/>ver precios</span>
                        </div>
                    );
                }

                return (
                    <div className="space-y-1">
                        <div className="flex flex-col">
                            <span className="text-[10px] text-gray-400 uppercase tracking-wider">PRECIO FINAL:</span>
                            <span className="text-3xl font-bold text-blue-600 leading-none tracking-tight">{formatCurrency(finalPrice)}</span>
                        </div>
                        {listPrice && (
                            <div className="flex flex-col">
                                    <span className="text-[10px] text-gray-400 uppercase tracking-wider">PRECIO LISTA:</span>
                                <span className="text-lg text-gray-400 line-through decoration-gray-400">{formatCurrency(listPrice)}</span>
                            </div>
                        )}
                        {showPublicPrice && (
                            <div className="flex flex-col pt-2 mt-1 transition-all duration-300">
                                    <span className="text-[10px] text-gray-400 uppercase tracking-wider">PRECIO PÚBLICO:</span>
                                    <div className="flex items-center gap-2">
                                    <span className="text-xl font-bold text-orange-500 leading-none">{formatCurrency(publicPriceWithMarkup)}</span>
                                    <span className="bg-orange-400 text-white text-[11px] font-bold px-2 py-0.5 rounded-full shadow-sm">{markup}%</span>
                                    </div>
                            </div>
                        )}
                    </div>
                );
            };

            // === CONTENIDO COMÚN (Bloque de Imagen Interactivo) ===
            const ImageBlock = ({ containerClass }) => (
                 <div className={`relative bg-white group/image cursor-pointer flex items-center justify-center ${containerClass}`}>
                    {/* Badge Descuento (Ocultar si es invitado) */}
                    {!isGuest && (
                        <div className="absolute top-3 right-3 z-30 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-full shadow-sm">10%</div>
                    )}

                    {/* Sidebar Iconos */}
                    <div className="absolute top-4 left-4 z-30 flex flex-col opacity-0 group-hover/image:opacity-100 -translate-x-2 group-hover/image:translate-x-0 transition-all duration-300">
                        <SideIcon icon={<Icons.Heart size={18} />} /><SideIcon icon={<Icons.ArrowLeftRight size={18} />} /><SideIcon icon={<Icons.Link size={18} />} /><SideIcon icon={<Icons.Bike size={18} />} /><SideIcon icon={<Icons.Info size={18} />} />
                    </div>

                    {/* Flechas Navegación */}
                    {product.images.length > 1 && (
                        <>
                            <button onClick={prevImage} className="absolute left-14 top-1/2 -translate-y-1/2 z-20 p-1.5 bg-white/90 rounded-full shadow text-gray-500 opacity-0 group-hover/image:opacity-100 hover:text-blue-600 hover:scale-110 transition"><Icons.ChevronLeft size={20} /></button>
                            <button onClick={nextImage} className="absolute right-2 top-1/2 -translate-y-1/2 z-20 p-1.5 bg-white/90 rounded-full shadow text-gray-500 opacity-0 group-hover/image:opacity-100 hover:text-blue-600 hover:scale-110 transition"><Icons.ChevronRight size={20} /></button>
                        </>
                    )}

                    {/* Imagen */}
                    <img src={product.images[currentImg]} className="max-h-full max-w-full object-contain transition-transform duration-300 group-hover/image:scale-105" alt={product.title} />

                    {/* Paginación */}
                    <div className="absolute bottom-2 left-0 w-full flex justify-center gap-1.5 z-20 opacity-0 group-hover/image:opacity-100 transition-opacity">
                        {product.images.map((_, idx) => (
                            <div key={idx} className={`h-1.5 rounded-full transition-all duration-300 shadow-sm ${idx === currentImg ? 'w-6 bg-blue-600' : 'w-1.5 bg-gray-300'}`} />
                        ))}
                    </div>
                    
                    {/* Marca de Agua */}
                    <div className="absolute bottom-6 right-4 opacity-20 pointer-events-none text-[9px] font-bold text-gray-400 text-center border border-gray-300 rounded px-1">e-biz<br/>INTERCAP</div>
                </div>
            );

            // === MODO GRILLA ===
            if (viewMode === 'grid') {
                return (
                    <div className="group bg-white rounded-xl shadow-sm hover:shadow-2xl transition-all duration-300 border border-gray-200 relative flex flex-col overflow-hidden">
                        <ImageBlock containerClass="p-6 h-72" />

                        {/* Datos Grid */}
                        <div className="px-5 pb-5 flex flex-col flex-grow bg-white z-10 border-t border-gray-50">
                            <div className="mb-2 pt-2">
                                <span className="text-xs font-bold text-blue-600 uppercase tracking-wide">{product.brand}</span>
                                <h3 className="text-sm font-bold text-gray-800 line-clamp-2 leading-tight mt-1 h-10" title={product.title}>{product.title}</h3>
                                <p className="text-xs text-gray-500 mt-1">Cod: {product.sku}</p>
                            </div>
                            
                            {/* Detalles (Solo si no es invitado) */}
                            {!isGuest && showDetails && (
                                <div className="overflow-hidden max-h-0 opacity-0 group-hover:max-h-40 group-hover:opacity-100 transition-all duration-500 ease-in-out border-l-2 border-gray-200 pl-3 mb-2">
                                    {product.presentation.map((l, i) => <p key={i} className="text-[10px] text-gray-500 leading-tight mb-0.5">{l}</p>)}
                                </div>
                            )}
                            
                            <div className="mt-auto">
                                <PriceBlock />
                            </div>
                            
                            {/* Stock (Solo si no es invitado) */}
                            {!isGuest && showDetails && (
                                <div className="flex justify-between items-end mt-3 pt-3 border-t border-gray-100 opacity-40 group-hover:opacity-100 transition-opacity">
                                    <StockBattery level={product.stock.noa} label="NOA" /><StockBattery level={product.stock.nea} label="NEA" />
                                    <StockBattery level={product.stock.bue} label="BUE" /><StockBattery level={product.stock.cuy} label="CUY" />
                                </div>
                            )}
                            
                            <div className="mt-4"><ActionButtons /></div>
                        </div>
                    </div>
                );
            }

            // === MODO LISTA ===
            return (
                <div className="group bg-white rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 border border-gray-200 flex flex-col sm:flex-row overflow-hidden relative">
                    
                    {/* Imagen Lista */}
                    <div className="w-full sm:w-64 h-64 sm:h-auto flex-shrink-0 border-b sm:border-b-0 sm:border-r border-gray-100">
                        <ImageBlock containerClass="h-full p-4" />
                    </div>

                    {/* Datos Centrales */}
                    <div className="flex-grow p-6 flex flex-col justify-center">
                         <div>
                            <span className="text-xs font-bold text-blue-600 uppercase tracking-wide">{product.brand}</span>
                            <h3 className="text-lg font-bold text-gray-800 leading-tight mt-1 mb-2">{product.title}</h3>
                            <p className="text-sm text-gray-500 mb-4">Cod: {product.sku}</p>
                         </div>
                         
                         {/* Lógica de detalles en Lista */}
                         {!isGuest ? (
                             showDetails ? (
                                <div className="space-y-4">
                                    <div className="bg-gray-50 p-3 rounded-lg border border-gray-100">
                                        <p className="text-xs font-bold text-gray-500 uppercase mb-2">Presentación</p>
                                        {product.presentation.map((l, i) => <p key={i} className="text-xs text-gray-600 mb-0.5">• {l}</p>)}
                                    </div>
                                    <div className="flex gap-4">
                                        <StockBattery level={product.stock.noa} label="NOA" /><StockBattery level={product.stock.nea} label="NEA" />
                                        <StockBattery level={product.stock.bue} label="BUE" /><StockBattery level={product.stock.cuy} label="CUY" />
                                    </div>
                                </div>
                             ) : (
                                <p className="text-xs text-gray-400 italic">Activa "Detalles" para ver stock y presentación.</p>
                             )
                         ) : (
                             <p className="text-xs text-gray-400 italic">Inicie sesión para ver detalles del producto.</p>
                         )}
                    </div>

                    {/* Columna Precio y Acción (Derecha) */}
                    <div className="w-full sm:w-72 bg-gray-50 sm:border-l border-gray-100 p-6 flex flex-col justify-center">
                        <div className="mb-6"><PriceBlock /></div>
                        <ActionButtons />
                    </div>
                </div>
            );
        };

        const App = () => {
            const [viewMode, setViewMode] = useState('grid');
            const [isLogged, setIsLogged] = useState(true);
            const [showSpecs, setShowSpecs] = useState(true);
            const [markup, setMarkup] = useState(10);
            const [showPublicPrice, setShowPublicPrice] = useState(true);
            const [isGuest, setIsGuest] = useState(false); // NUEVO ESTADO: INVITADO

            return (
                <div className="min-h-screen font-sans pb-20">
                    <div className="bg-white shadow-sm border-b sticky top-0 z-50 px-4 py-3">
                        <div className="max-w-7xl mx-auto flex flex-col xl:flex-row justify-between items-center gap-4">
                            <h1 className="text-xl font-black text-blue-700 italic tracking-tighter">INTERCAP <span className="text-gray-400 text-sm font-normal not-italic">| V12</span></h1>
                            
                            <div className="flex flex-wrap justify-center items-center gap-3 bg-gray-50 p-2 rounded-lg border border-gray-200">
                                
                                {/* NUEVO CONTROL: SIN LOGUEARSE */}
                                <label className="flex items-center gap-2 text-xs font-bold text-red-600 cursor-pointer select-none bg-red-50 px-3 py-1.5 rounded border border-red-200 hover:bg-red-100 transition-colors">
                                    <input type="checkbox" checked={isGuest} onChange={() => setIsGuest(!isGuest)} className="checkbox-custom accent-red-600" style={{borderColor: '#ef4444'}} />
                                    SIN LOGUEARSE
                                </label>
                                <div className="w-px h-6 bg-gray-300"></div>

                                {/* Controles que se desactivan si es Invitado */}
                                <div className={`flex items-center gap-3 transition-opacity duration-300 ${isGuest ? 'guest-mode-active' : ''}`}>
                                    
                                    {/* Toggle Vista */}
                                    <div className="flex bg-white rounded border border-gray-200 p-0.5">
                                        <button onClick={()=>setViewMode('grid')} className={`p-1.5 rounded ${viewMode==='grid' ? 'bg-blue-100 text-blue-600' : 'text-gray-400 hover:text-gray-600'}`} title="Vista Grilla"><Icons.Grid size={18}/></button>
                                        <button onClick={()=>setViewMode('list')} className={`p-1.5 rounded ${viewMode==='list' ? 'bg-blue-100 text-blue-600' : 'text-gray-400 hover:text-gray-600'}`} title="Vista Lista"><Icons.List size={18}/></button>
                                    </div>
                                    <div className="w-px h-6 bg-gray-300"></div>

                                    <label className="flex items-center gap-2 text-xs font-bold text-gray-500 cursor-pointer select-none">
                                        <input type="checkbox" checked={isLogged} onChange={() => setIsLogged(!isLogged)} className="checkbox-custom" /> MAYORISTA
                                    </label>
                                    <div className="w-px h-6 bg-gray-300"></div>
                                    
                                    <div className="flex items-center gap-3 bg-white px-3 py-1 rounded border border-gray-200 shadow-sm">
                                        <label className="flex items-center gap-2 text-xs font-bold text-gray-700 cursor-pointer select-none">
                                            <input type="checkbox" checked={showPublicPrice} onChange={() => setShowPublicPrice(!showPublicPrice)} className="checkbox-custom" /> P.Público
                                        </label>
                                        <div className="w-px h-6 bg-gray-200"></div>
                                        <div className="flex items-center gap-2">
                                            <div className="relative">
                                                <input type="number" value={markup} onChange={(e)=>setMarkup(e.target.value)} className="w-14 pl-1 pr-5 py-0.5 border border-gray-300 rounded text-right text-sm font-bold text-gray-700 focus:outline-none focus:border-blue-500" />
                                                <span className="absolute right-1.5 top-1/2 -translate-y-1/2 text-gray-400 text-[10px] font-bold">%</span>
                                            </div>
                                            <Icons.Calculator size={16} className="text-gray-400" />
                                        </div>
                                    </div>
                                    <div className="w-px h-6 bg-gray-300"></div>
                                    <button onClick={()=>setShowSpecs(!showSpecs)} className="text-xs font-bold text-blue-700 uppercase px-2">{showSpecs ? 'Detalles ON' : 'Detalles OFF'}</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className={`max-w-7xl mx-auto p-6 ${viewMode === 'grid' ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-8' : 'flex flex-col gap-6'}`}>
                        {MOCK_PRODUCTS.map(p => (
                            <ProductCard key={p.id} product={p} viewMode={viewMode} isLogged={isLogged} showDetails={showSpecs} markup={markup} showPublicPrice={showPublicPrice} isGuest={isGuest} />
                        ))}
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
