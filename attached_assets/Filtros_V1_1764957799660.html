<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>INTERCAP - Calidad, Precio y Variedad en un solo lugar</title>
  <meta name="description" content="Catálogo de cubiertas para moto con filtros por ancho, relación y rodado. Ofertas, stock por sucursal y envío." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&display=swap" rel="stylesheet">
  
  <style>
    :root{
      --bg:#f5f7fb; --fg:#0f172a; --muted:#64748b;
      --blue-950:#0a142e; --blue-900:#0b1f4d; --blue-800:#132a69; --blue-700:#1d4ed8; --blue-600:#2563eb; --blue-500:#3b82f6; --blue-200:#bfdbfe;
      --radius:12px; --shadow:0 4px 12px rgba(2,6,23,.06);
      --card-border:#eaeef3; --chip:#334155;
      --stock-low:#f59e0b; --stock-mid:#fde047; --stock-high:#16a34a; --stock-none:#ef4444; --stock-cuyo:#ef4444; --stock-bue:#16a34a;
      --header-h:64px; --sidebar-w:260px;
      --card-width:226px;
      --card-height:360px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Arial;background:var(--bg);color:var(--fg)}

    /* ===== Header fijo (oscuro) ===== */
    .site-header{position:fixed;inset:0 0 auto 0;height:var(--header-h);z-index:50;background:linear-gradient(180deg, #0d152f 0%, #0f172a 100%);box-shadow:0 2px 12px rgba(0,0,0,.25)}
    .site-header .inner{max-width:1280px;margin:0 auto;height:100%;display:flex;align-items:center;gap:20px;padding:0 20px;color:#e5e7eb}
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;text-decoration:none;color:inherit}
    .logo .iso{width:8px;height:28px;border-radius:3px;background:var(--blue-500)}
    .logo .brand-name{font-family:"Racing Sans One", sans-serif;font-weight:400;font-style:normal;font-size:1.8rem;}
    .primary-nav{display:flex;gap:18px;margin-left:12px}
    .primary-nav a{color:#e5e7eb;text-decoration:none;font-weight:600;opacity:.9; padding:8px 12px; border-radius:8px;}
    .primary-nav a:hover, .primary-nav a[aria-current="page"]{opacity:1; background:rgba(29,78,216,0.3);}
    .searchbar{margin-left:auto;display:flex;align-items:center;gap:8px}
    .searchbar input{height:38px;width:320px;border-radius:10px;border:1px solid #223; background:#0b1226;color:#e5e7eb;padding:0 12px}
    .cart{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:#0b1226}

    /* Hamburger menu for mobile */
    .hamburger{display:none;flex-direction:column;justify-content:center;gap:4px;width:30px;height:30px;cursor:pointer;}
    .hamburger span{display:block;width:100%;height:2px;background:#e5e7eb;border-radius:2px;}

    /* Empuje del layout por header fijo */
    .page{padding-top:var(--header-h)}

    /* ===== Sidebar fijo (oscuro) ===== */
    .sidebar{position:fixed;left:0;top:var(--header-h);bottom:0;width:var(--sidebar-w);background:#0f172a;color:#e2e8f0;border-right:1px solid #111827;overflow:auto;padding:16px;transition:transform 0.3s ease;}
    .sidebar h2{font-size:.95rem;margin:6px 0 10px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.06em}
    details{background:#0b1226;border:1px solid #1f2937;border-radius:12px;margin-bottom:12px;padding:8px 10px;color:#cbd5e1}
    summary{cursor:pointer;font-weight:700; display:flex; justify-content:space-between; align-items:center; padding:8px 0;}
    summary::after{content:"\25B6"; transform:rotate(90deg); transition:transform 0.3s ease;}
    details[open] summary::after{transform:rotate(270deg);}
    .chipset{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .chip{border:1px solid var(--chip);border-radius:999px;padding:6px 10px;background:#0f172a;color:#e2e8f0;cursor:pointer; transition:all 0.2s ease;}
    .chip[aria-pressed="true"]{background:var(--blue-500);border-color:transparent; color:white;}

    /* Mobile sidebar overlay */
    .sidebar-overlay{display:none;position:fixed;top:var(--header-h);left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:49;}
    .sidebar.active{transform:translateX(0);}
    .sidebar-overlay.active{display:block;}

    /* ===== Contenido principal (mueve independiente del sidebar) ===== */
    .content-wrap{margin-left:var(--sidebar-w)}

    .hero{max-width:1280px;margin:16px auto;border-radius:16px;background:#0b1f4d;color:#fff;padding:16px}
    .filters-inline{display:grid;grid-template-columns: repeat(4, 1fr) auto; gap:8px}
    .filters-inline select, .filters-inline input{height:40px;border-radius:10px;border:1px solid #223;background:#0f172a;color:#fff;padding:0 10px}
    .btn-primary{background:var(--blue-600);border:none;color:#fff;padding:0 16px;border-radius:10px;height:40px;cursor:pointer;font-weight:600}

    /* Applied filters */
    .applied-filters{max-width:1280px;margin:16px auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
    .applied-filters h3{margin:0 10px 0 0;font-size:1rem;color:var(--fg);}
    .filter-chip{display:flex;align-items:center;gap:6px;background:var(--blue-500);color:white;padding:4px 10px;border-radius:20px;font-size:.8rem;}
    .filter-chip button{background:none;border:none;color:white;cursor:pointer;font-size:1.2rem;padding:0;}

    /* Sorting control */
    .controls{max-width:1280px;margin:16px auto;padding:0 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
    .sort-control{display:flex;align-items:center;gap:8px;}
    .sort-control select{height:40px;border-radius:10px;border:1px solid #223;background:#0f172a;color:#fff;padding:0 10px;}
    
    /* View mode toggle */
    .view-mode{display:flex;align-items:center;gap:8px;}
    .view-btn{background:#0f172a;color:#e5e7eb;border:1px solid #223;padding:8px 12px;border-radius:8px;cursor:pointer;}
    .view-btn.active{background:var(--blue-600);color:#fff;}
    .view-btn i{margin-right:6px;}

    /* Pagination with "Mostrar más" style */
    .pagination-container{max-width:1280px;margin:16px auto;padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:16px;}
    .pagination-info{font-size:.85rem;color:#64748b;text-align:center;}
    .pagination-divider{width:100%;max-width:300px;height:1px;background:#e2e8f0;margin:8px 0;}
    .load-more-btn{background:transparent;border:2px solid var(--blue-600);color:var(--blue-600);padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;transition:all 0.2s ease;}
    .load-more-btn:hover{background:var(--blue-600);color:#fff;}

    .container{max-width:1280px;margin:0 auto;padding:0 16px}
    .grid{list-style:none;padding:0;margin:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill, minmax(var(--card-width), 1fr));}
    
    @media (min-width:600px){ .grid{grid-template-columns:repeat(auto-fill, minmax(var(--card-width), 1fr));} }
    @media (min-width:900px){ .grid{grid-template-columns:repeat(auto-fill, minmax(var(--card-width), 1fr));} }
    @media (min-width:1200px){ .grid{grid-template-columns:repeat(auto-fill, minmax(var(--card-width), 1fr));} }

    /* List view - FIXED */
    .list-view{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:16px;}
    .list-item{background:#fff;border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;padding:16px;transition:transform 0.2s ease;}
    .list-item:hover{transform:translateX(4px);}
    .list-item__media{flex-shrink:0;width:120px;height:120px;aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px;}
    .list-item__media img{max-width:90%;height:auto;object-fit:contain}
    .list-item__body{flex:1;min-width:0;}
    .list-item__brand{font-size:.7rem;color:#374151;text-transform:uppercase;letter-spacing:.04em}
    .list-item__title{font:600 .85rem/1.3 system-ui;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    .list-item__meta{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .list-item__price{display:flex;align-items:center;gap:6px;margin-top:4px;}
    .list-item__price-now{font:800 1.3rem/1 system-ui;color:var(--blue-700)}
    .list-item__disc-pill{display:inline-block;font-size:.75rem;background:var(--blue-600);color:#fff;padding:2px 8px;border-radius:12px;margin-left:4px;}
    .list-item__price-old{text-decoration:line-through;color:#94a3b8;font-size:.8rem;margin-top:4px;}
    .list-item__stock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px 10px;margin-top:auto;}
    .list-item__stock-item{text-align:center;font-size:.65rem;color:#475569}
    .list-item__dot{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font:700 .75rem/1 system-ui;border:2px solid #e5e7eb;color:#0b1f4d}
    .list-item__dot--low{background:var(--stock-low);color:#fff;border-color:var(--stock-low)}
    .list-item__dot--mid{background:var(--stock-mid);color:#0b1f4d;border-color:var(--stock-mid)}
    .list-item__dot--high{background:var(--stock-high);color:#fff;border-color:var(--stock-high)}
    .list-item__dot--none{background:var(--stock-none);color:#fff;border-color:var(--stock-none)}
    .list-item__dot--cuyo{background:var(--stock-cuyo);color:#fff;border-color:var(--stock-cuyo)}
    .list-item__dot--bue{background:var(--stock-bue);color:#fff;border-color:var(--stock-bue)}
    .list-item__dot--none::after, .list-item__dot--cuyo::after{content:"×";font-weight:900;font-size:1.2rem;}
    .list-item__dot--low::after, .list-item__dot--high::after, .list-item__dot--bue::after{content:"✓";font-weight:900;}
    .list-item__cta{padding:8px 10px;border-top:1px solid #eef2f7}
    .list-item__btn-buy{width:100%;height:40px;border:none;border-radius:8px;background:var(--blue-700);color:#fff;font-weight:700;font-size:.85rem;cursor:pointer}

    .card{position:relative;background:#fff;border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:var(--card-width);max-width:var(--card-width);}
    .favorite{position:absolute;top:8px;right:8px;background:transparent;border:none;color:#64748b;font-size:1.2rem;z-index:2;cursor:pointer;transition:color 0.2s ease;}
    .favorite.favorited{color:var(--blue-700);}
    .card__media{aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px;}
    .card__media img{max-width:90%;height:auto;object-fit:contain}
    .card__body{padding:10px;display:grid;gap:4px;flex:1;}
    .card__brand{font-size:.7rem;color:#374151;text-transform:uppercase;letter-spacing:.04em}
    .card__title{font:600 .85rem/1.3 system-ui;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    .card__meta{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .price{display:flex;align-items:center;gap:6px;margin-top:4px;}
    .price__now{font:800 1.3rem/1 system-ui;color:var(--blue-700)}
    .disc-pill{display:inline-block;font-size:.75rem;background:var(--blue-600);color:#fff;padding:2px 8px;border-radius:12px;margin-left:4px;}
    .price__old{text-decoration:line-through;color:#94a3b8;font-size:.8rem;margin-top:4px;}
    .stock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px 10px;margin-top:auto;}
    .stock__item{text-align:center;font-size:.65rem;color:#475569}
    .dot{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font:700 .75rem/1 system-ui;border:2px solid #e5e7eb;color:#0b1f4d}
    .dot--low{background:var(--stock-low);color:#fff;border-color:var(--stock-low)}
    .dot--mid{background:var(--stock-mid);color:#0b1f4d;border-color:var(--stock-mid)}
    .dot--high{background:var(--stock-high);color:#fff;border-color:var(--stock-high)}
    .dot--none{background:var(--stock-none);color:#fff;border-color:var(--stock-none)}
    .dot--cuyo{background:var(--stock-cuyo);color:#fff;border-color:var(--stock-cuyo)}
    .dot--bue{background:var(--stock-bue);color:#fff;border-color:var(--stock-bue)}
    .dot--none::after, .dot--cuyo::after{content:"×";font-weight:900;font-size:1.2rem;}
    .dot--low::after, .dot--high::after, .dot--bue::after{content:"✓";font-weight:900;}

    .card__cta{padding:8px 10px;border-top:1px solid #eef2f7}
    .btn-buy{width:100%;height:40px;border:none;border-radius:8px;background:var(--blue-700);color:#fff;font-weight:700;font-size:.85rem;cursor:pointer}

    /* Mobile styles */
    @media (max-width: 768px) {
      .hamburger{display:flex;}
      .primary-nav{display:none;position:absolute;top:100%;left:0;right:0;background:#0f172a;padding:16px;border-top:1px solid #111827;}
      .primary-nav.active{display:flex;flex-direction:column;gap:12px;}
      .searchbar input{width:200px;}
      .filters-inline{grid-template-columns:1fr auto;}
      .controls{flex-direction:column;align-items:stretch;}
      .sort-control, .view-mode{width:100%;justify-content:center;}
      .applied-filters{padding:0 16px; justify-content:center; flex-wrap:wrap;}
      .pagination-container{padding:0 16px;}
      :root{--card-width:160px;}
      .list-item{flex-direction:column;align-items:stretch;}
      .list-item__media{width:100%;height:120px;}
    }

    @media (max-width: 992px) {
      .sidebar{transform:translateX(-100%);}
      .content-wrap{margin-left:0;}
    }
  </style>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="site-header" role="banner">
    <div class="inner">
      <a class="logo" href="#" aria-label="INTERCAP Home">
        <span class="iso" aria-hidden="true"></span>
        <span class="brand-name">INTERCAP</span>
      </a>
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <nav class="primary-nav" id="primary-nav" aria-label="Principal">
        <a href="#" id="home-link" aria-current="page">HOME</a>
        <a href="#" id="catalog-link">CATALOGO</a>
        <a href="#">CARRITO</a>
        <a href="#">ADMINISTRACION</a>
        <a href="#">VENTAS ESPECIALES</a>
      </nav>
      <div class="searchbar">
        <input type="search" placeholder="Search" aria-label="Buscar"/>
        <span class="cart" aria-label="Carrito" title="Carrito">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h7.72a2 2 0 0 0 2-1.61L21 6H6"/></svg>
        </span>
      </div>
    </div>
  </header>

  <div class="page">
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar" aria-label="Filtros">
      <h2>Filtros</h2>
      <details open>
        <summary>Marca</summary>
        <div class="chipset" id="f-marca"></div>
      </details>
      <details open>
        <summary>Ancho</summary>
        <div class="chipset" id="f-ancho"></div>
      </details>
      <details open>
        <summary>Relación</summary>
        <div class="chipset" id="f-relacion"></div>
      </details>
      <details open>
        <summary>Rodado</summary>
        <div class="chipset" id="f-rodado"></div>
      </details>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ===== CONTENT ===== -->
    <main class="content-wrap">
      <!-- HOME PAGE -->
      <section class="home-page" id="home-page">
        <section class="hero" aria-label="Buscador de neumáticos">
          <h1 style="margin:0 0 8px">Encontrá el neumático para tu moto</h1>
          <div class="filters-inline">
            <input id="med" type="search" placeholder="Ej: 120/70-17" />
            <button id="btn-hero" class="btn-primary">Buscar</button>
          </div>
        </section>

        <div class="applied-filters" id="applied-filters">
          <h3>Filtros aplicados:</h3>
          <!-- Filtros aplicados se insertarán aquí -->
        </div>

        <div class="controls">
          <div class="sort-control">
            <label for="sort-select">Ordenar por:</label>
            <select id="sort-select">
              <option value="price-asc">Precio: Menor a Mayor</option>
              <option value="price-desc">Precio: Mayor a Menor</option>
              <option value="discount-desc">Descuento: Mayor a Menor</option>
            </select>
          </div>
          <div class="view-mode">
            <button class="view-btn active" id="view-grid" data-view="grid">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1" ry="1"/><rect x="14" y="3" width="7" height="7" rx="1" ry="1"/><rect x="14" y="14" width="7" height="7" rx="1" ry="1"/><rect x="3" y="14" width="7" height="7" rx="1" ry="1"/></svg>
              Celda
            </button>
            <button class="view-btn" id="view-list" data-view="list">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h4l2.68 13.39a2 2 0 0 0 2 1.61h7.72a2 2 0 0 0 2-1.61L21 6H6"/></svg>
              Lista
            </button>
          </div>
        </div>

        <section class="container">
          <ul id="grid" class="grid" aria-live="polite"></ul>
          <ul id="list" class="list-view" aria-live="polite" style="display:none;"></ul>
        </section>

        <div class="pagination-container">
          <div class="pagination-info" id="pagination-info">Mostrando 0 de 0</div>
          <div class="pagination-divider"></div>
          <button class="load-more-btn" id="load-more-btn">MOSTRAR MÁS</button>
        </div>
      </section>

      <!-- CATALOG PAGE -->
      <section class="catalog-page" id="catalog-page" style="display:none;">
        <section class="hero" aria-label="Buscador de neumáticos">
          <h1 style="margin:0 0 8px">Encontrá el neumático para tu moto</h1>
          <div class="filters-inline">
            <input id="med-catalog" type="search" placeholder="Ej: 120/70-17" />
            <button id="btn-hero-catalog" class="btn-primary">Buscar</button>
          </div>
        </section>

        <div class="applied-filters" id="applied-filters-catalog">
          <h3>Filtros aplicados:</h3>
          <!-- Filtros aplicados se insertarán aquí -->
        </div>

        <div class="controls">
          <div class="sort-control">
            <label for="sort-select-catalog">Ordenar por:</label>
            <select id="sort-select-catalog">
              <option value="price-asc">Precio: Menor a Mayor</option>
              <option value="price-desc">Precio: Mayor a Menor</option>
              <option value="discount-desc">Descuento: Mayor a Menor</option>
            </select>
          </div>
          <div class="view-mode">
            <button class="view-btn active" id="view-grid-catalog" data-view="grid">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1" ry="1"/><rect x="14" y="3" width="7" height="7" rx="1" ry="1"/><rect x="14" y="14" width="7" height="7" rx="1" ry="1"/><rect x="3" y="14" width="7" height="7" rx="1" ry="1"/></svg>
              Celda
            </button>
            <button class="view-btn" id="view-list-catalog" data-view="list">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h4l2.68 13.39a2 2 0 0 0 2 1.61h7.72a2 2 0 0 0 2-1.61L21 6H6"/></svg>
              Lista
            </button>
          </div>
        </div>

        <section class="container">
          <ul id="grid-catalog" class="grid" aria-live="polite"></ul>
          <ul id="list-catalog" class="list-view" aria-live="polite" style="display:none;"></ul>
        </section>

        <div class="pagination-container">
          <div class="pagination-info" id="pagination-info-catalog">Mostrando 0 de 0</div>
          <div class="pagination-divider"></div>
          <button class="load-more-btn" id="load-more-btn-catalog">MOSTRAR MÁS</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const imagenNeumatico = "https://imagenes-inp-aws.s3.amazonaws.com/imagenes/productos/001/27062025_001001270001-1_min.jpg";

    // Complete product list with all brands
    const productos = [
      // CELIMO
      {id:1,brand:'CELIMO',titulo:'100/80-17 52S TL HD-565',codigo:'001001160002',precio:44726.60,precioLista:49000,img:imagenNeumatico,stock:{BUE:5,CUYO:3,NEA:7,NOA:4}, ancho:100, relacion:80, rodado:17},

    function ars(n){return n.toLocaleString('es-AR',{style:'currency',currency:'ARS'})}
    function off(a,b){return Math.round(100*(1-a/b))}
    function level(zone, qty){
      if(zone === 'CUYO') return 'cuyo';
      if(zone === 'BUE') return 'bue';
      if(qty === 0 || qty === null || qty === undefined) return 'none';
      return qty > 50 ? 'high' : qty >= 4 ? 'mid' : 'low';
    }

      catalogLink.removeAttribute('aria-current');
    });

      e.preventDefault();
      homePage.style.display = 'none';

      homeLink.removeAttribute('aria-current');
      renderCatalog();

    viewGridBtn.addEventListener('click', () => {
      setCurrentView('grid');
    });
    
    viewListBtn.addEventListener('click', () => {

    });

    function setCurrentView(view) {
      currentView = view;
      viewGridBtn.classList.toggle('active', view === 'grid');
      viewListBtn.classList.toggle('active', view === 'list');
      grid.style.display = view === 'grid' ? 'grid' : 'none';
      list.style.display = view === 'list' ? 'flex' : 'none';
      renderCatalog();
    }

    // Filter state
    const filtros={marca:new Set(), ancho:new Set(), relacion:new Set(), rodado:new Set()};
    
    // Pagination state
    let currentPage = 1;
    const itemsPerPage = 30;

    function uniqueSorted(arr,key){
      return [...new Set(arr.map(x=>x[key]||null))].filter(Boolean).sort((a,b)=>a-b)
    }
    
    function renderChipset(id,values,key){
      const cont=document.getElementById(id);
      if(!cont) return;
      cont.innerHTML='';
      values.forEach(v=>{
        const b=document.createElement('button');
        b.className='chip';
        b.type='button';
        b.setAttribute('aria-pressed',filtros[key].has(v) ? 'true' : 'false');
        b.textContent=v;
        b.addEventListener('click',()=>{
          const on=b.getAttribute('aria-pressed')==='true';
          if(on){
            b.setAttribute('aria-pressed','false');
            filtros[key].delete(v);
          } else {
            b.setAttribute('aria-pressed','true');
            filtros[key].add(v);
          }
          currentPage = 1;
          renderCatalog();
        });
        cont.appendChild(b);
      });
    }

    function applyFilters(list){
      return list.filter(p=>{
        const okM = filtros.marca.size ? filtros.marca.has(p.brand) : true;
        const okA = filtros.ancho.size ? filtros.ancho.has(p.ancho) : true;
        const okR = filtros.relacion.size ? filtros.relacion.has(p.relacion) : true;
        const okRo= filtros.rodado.size ? filtros.rodado.has(p.rodado) : true;
        return okM && okA && okR && okRo;
      });
    }

    function sortProducts(list, sortBy){
      return [...list].sort((a,b) => {
        switch(sortBy){
          case 'price-asc':
            return a.precio - b.precio;
          case 'price-desc':
            return b.precio - a.precio;
          case 'discount-desc':
            return off(b.precio,b.precioLista) - off(a.precio,a.precioLista);
          default:
            return 0;
        }
      });
    }

    function paginate(list, page, perPage){
      const start = (page - 1) * perPage;
      const end = start + perPage;
      return list.slice(start, end);
    }

    function updatePaginationInfo(filteredCount, totalItems, currentPage, itemsPerPage) {
      const currentEnd = Math.min(currentPage * itemsPerPage, filteredCount);
      paginationInfo.textContent = `Mostrando ${currentEnd} de ${totalItems}`;
      
      // Show/hide "Mostrar Más" button based on whether there are more items to show
      if (currentPage * itemsPerPage >= filteredCount) {
        loadMoreBtn.style.display = 'none';
      } else {
        loadMoreBtn.style.display = 'block';
      }
    }

    function card(p){

      li.className='card';
      li.innerHTML=`

        <div class="card__media"><img src="${p.img}" alt="${p.titulo}" loading="lazy" decoding="async"/></div>
        <div class="card__body">
          <div class="card__brand">${p.brand}</div>
          <h3 class="card__title">${p.titulo}</h3>
          <div class="card__meta">Código: ${p.codigo}</div>
          <div class="price">
            <span class="price__now">${ars(p.precio)}</span>
            <span class="disc-pill">${off(p.precio,p.precioLista)}%</span>
          </div>
          <div class="price__old">${ars(p.precioLista)}</div>
        </div>
        <div class="stock" aria-label="Stock por sucursal">
          ${['BUE','CUYO','NEA','NOA'].map(z=>{ 
            const qty=(p.stock&&p.stock[z])??0; 
            const lvl=level(z, qty); 
            return `<div class='stock__item'><div>${z}</div><div class='dot dot--${lvl}' title='${qty} unidades'>${lvl==='high'||lvl==='bue'?'✓':lvl==='none'||lvl==='cuyo'?'×':''}</div></div>`; 
          }).join('')}
        </div>
        <div class="card__cta"><button class="btn-buy" type="button">AGREGAR</button></div>`;

    }

      let filtered = applyFilters([...productos]);
      let sorted = sortProducts(filtered, sortSelect.value);
      const paginated = paginate(sorted, currentPage, itemsPerPage);
      
      // Render products
      grid.innerHTML='';
      list.innerHTML='';
      paginated.forEach(p=> {
        grid.appendChild(card(p));
        list.appendChild(listItem(p));
      });
      
      // Render pagination
      updatePaginationInfo(sorted.length, productos.length, currentPage, itemsPerPage);
    }

    // Event listeners
    sortSelect.addEventListener('change', () => {
      currentPage = 1;
      renderCatalog();
    });

    loadMoreBtn.addEventListener('click', () => {
      currentPage++;
      renderCatalog();
    });

    // Handle favorite button clicks
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('favorite')) {
        e.target.classList.toggle('favorited');
      }
    });

    // Initialize with Home page visible
    homePage.style.display = 'block';
    catalogPage.style.display = 'none';
    homeLink.setAttribute('aria-current', 'page');
    catalogLink.removeAttribute('aria-current');
    
    // Initialize catalog view
    renderCatalog();
  </script>
</body>
</html>
